name: Playwright live browser QA

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Live app URL to smoke
        required: false
        default: https://big-cruise-app.vercel.app
  push:
    branches:
      - supabase-auth-single-source
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    name: Runner canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove the hosted runner started
        run: |
          echo "runner_ok"
          uname -a
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"

  e2e:
    name: Browser smoke tests
    needs: canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_UNO_EMAIL_A: ${{ secrets.E2E_UNO_EMAIL_A }}
      E2E_UNO_PASSWORD_A: ${{ secrets.E2E_UNO_PASSWORD_A }}
      E2E_UNO_EMAIL_B: ${{ secrets.E2E_UNO_EMAIL_B }}
      E2E_UNO_PASSWORD_B: ${{ secrets.E2E_UNO_PASSWORD_B }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright smoke tests against Vercel
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || 'https://big-cruise-app.vercel.app' }}
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
